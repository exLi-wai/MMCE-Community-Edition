name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mmcece-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 3

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

  gametest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run server game tests
        id: gametest
        continue-on-error: true
        timeout-minutes: 30
        run: ./gradlew runGameTestServer --init-script gradle/core-gametest.init.gradle --no-configuration-cache --console=plain --stacktrace

      - name: Upload game test logs
        if: steps.gametest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            build/gametest-core/logs/latest.log
            build/gametest-core/logs/debug.log
            build/gametest-core/crash-reports/*.txt
          if-no-files-found: ignore
          retention-days: 3
