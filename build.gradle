plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'com.diffplug.spotless' version '8.10.4'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    maven {
        url 'https://jitpack.io'
    }

    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }

    maven {
        name = 'LatvianMods'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = 'https://cursemaven.com/'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            def restartPhase = providers.gradleProperty('paidRunRestartPhase').getOrElse('')
            if (!(restartPhase in ['', 'write', 'read'])) {
                throw new GradleException('paidRunRestartPhase must be write or read')
            }
            gameDirectory = project.file(restartPhase ? 'build/gametest-restart' : 'build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', restartPhase ? 'mmcece_restart' : project.mod_id
            systemProperty 'mmcece.lifecycle.restartPhase', restartPhase
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    // Required tooltip integration, present at compile time and runtime.
    implementation "curse.maven:jade-324717:${jade_file_id}"
    implementation "curse.maven:kubejs-238086:${kubejs_file_id}"

    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    compileOnly "curse.maven:applied-energistics-2-223794:${ae2_file_id}"
    compileOnly "curse.maven:guideme-1173950:${guideme_file_id}"
    compileOnly "curse.maven:neovitae-1404763:${neovitae_file_id}"
    compileOnly "curse.maven:natures-aura-306626:${natures_aura_file_id}"
    compileOnly "curse.maven:astral-sorcery-241721:${astral_sorcery_file_id}"
    compileOnly "curse.maven:geckolib-388172:${geckolib_file_id}"
    compileOnly "curse.maven:modonomicon-538392:${modonomicon_file_id}"
    compileOnly "curse.maven:observerlib-316833:${observerlib_file_id}"
    compileOnly "curse.maven:thaumaturge-1628024:${thaumaturge_file_id}"
    compileOnly "curse.maven:jec-250702:${jec_file_id}"
    compileOnly "curse.maven:emi-580555:${emi_file_id}"
    compileOnly("vazkii.botania:botania-neoforge-1.21.1:${botania_version}") {exclude group: 'mezz.jei'}
    compileOnly 'com.github.Towdium:PinIn:1.6.0'

    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    localRuntime "dev.latvian.mods:rhino:${rhino_version}"
    localRuntime "curse.maven:applied-energistics-2-223794:${ae2_file_id}"
    localRuntime "curse.maven:guideme-1173950:${guideme_file_id}"
    localRuntime "curse.maven:neovitae-1404763:${neovitae_file_id}"
    localRuntime "curse.maven:natures-aura-306626:${natures_aura_file_id}"
    localRuntime "curse.maven:astral-sorcery-241721:${astral_sorcery_file_id}"
    localRuntime "curse.maven:geckolib-388172:${geckolib_file_id}"
    localRuntime "curse.maven:modonomicon-538392:${modonomicon_file_id}"
    localRuntime "curse.maven:observerlib-316833:${observerlib_file_id}"
    localRuntime "curse.maven:thaumaturge-1628024:${thaumaturge_file_id}"
    localRuntime "curse.maven:Lithostitched-936015:${Lithostitched_file_id}"
    localRuntime "curse.maven:jec-250702:${jec_file_id}"
    localRuntime("vazkii.botania:botania-neoforge-1.21.1:${botania_version}") {exclude group: 'mezz.jei'}
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

neoForge.ideSyncTask tasks.named('processResources')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse('4.35').configProperties(file('eclipse-formatter.properties').text)
        replaceRegex(
            'keep class declaration headers on one line',
            '(?m)^([ \\t]*(?:(?:public|protected|private|abstract|final|static|sealed|non-sealed)\\s+)*(?:class|interface)\\s+[A-Za-z_$][A-Za-z0-9_$]*[^\\r\\n]*)\\r?\\n[ \\t]+(?=(?:extends|implements)\\b)',
            '$1 ')
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}
