// One isolated namespace for the confirmed vanilla smelting load regression.
allprojects {
    afterEvaluate {
        if (extensions.findByName('neoForge') != null) {
            configurations.named('localRuntime') {
                withDependencies { dependencies ->
                    dependencies.removeAll { dependency ->
                        dependency.group == 'curse.maven' && dependency.name == 'thaumaturge-1628024'
                    }
                }
            }
            neoForge.runs.named('gameTestServer') {
                gameDirectory = project.file('build/gametest-adapter-smelting')
                systemProperty 'neoforge.enabledGameTestNamespaces', 'mmcece_adapter'
                systemProperty 'mmcece.adapter.kubejsSmoke', 'true'
                logLevel = org.slf4j.event.Level.INFO
            }
            def fixtures = tasks.register('prepareRecipeAdapterFixtures', Copy) {
                from project.file('src/gameTest/resources/data/mmcece/mmcece/machines')
                into project.file('build/gametest-adapter-smelting/config/modularmachinery/machinery')
                include '**/*.json'
            }
            def script = tasks.register('prepareRecipeAdapterCrtScript', Copy) {
                from project.file('src/gameTest/scripts/recipe_adapter_crt.js')
                into project.file('build/gametest-adapter-smelting/kubejs/server_scripts')
                rename 'recipe_adapter_crt[.]js', 'test_recipe_adapter_crt.js'
            }
            tasks.named('runGameTestServer') {
                dependsOn fixtures
                dependsOn script
            }
        }
    }
}
